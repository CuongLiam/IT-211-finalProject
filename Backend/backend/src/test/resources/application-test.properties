# Test profile using H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3QtcnVubmluZy1pdC0yMTEtcHJvamVjdA==
app.jwt.access-token-expiration-ms=1800000
app.jwt.refresh-token-expiration-ms=1209600000

# Upload
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Cloudinary (dummy for tests)
app.cloudinary.cloud-name=test
app.cloudinary.api-key=test
app.cloudinary.api-secret=test
app.cloudinary.folder=test

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Disable Redis for unit tests (use mock)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
